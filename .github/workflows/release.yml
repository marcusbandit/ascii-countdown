name: Release

# Push a tag such as v0.2.0 and this builds static musl binaries for x86_64 and
# aarch64 and attaches them to the GitHub release for that tag, creating the
# release if it does not exist yet.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and upload
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # Pure Rust, no C code: the musl targets link with rust-lld and their
      # bundled C runtime, so no cross compiler is needed.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$TAG" || { echo "tag $TAG but Cargo.toml says $version"; exit 1; }
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name=tock-${{ matrix.arch }}-linux
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/tock README.md LICENSE "dist/$name/"
          cp -r completions "dist/$name/"
          # tock sits at the top of the tarball, so `tar -xz tock` pulls just the binary.
          tar -C "dist/$name" -czf "dist/$name.tar.gz" tock completions README.md LICENSE
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes || true
          gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
