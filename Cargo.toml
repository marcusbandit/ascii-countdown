[package]
name = "tock"
version = "0.3.0"
edition = "2021"
description = "Full screen countdown timer and stopwatch for the terminal, drawn in big ASCII-art digits"
license = "MIT"
repository = "https://github.com/marcusbandit/ascii-countdown"
readme = "README.md"
keywords = ["timer", "countdown", "stopwatch", "terminal", "tui"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.28"
signal-hook = "0.3"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
